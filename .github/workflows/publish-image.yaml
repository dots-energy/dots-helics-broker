name: Push image to image registery

permissions: write-all

on:
  push:
    tags:
      - v*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
env:
  IMAGE_NAME: dots-helics-broker
jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Define version for pull request
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: echo "VERSION=${BRANCH_NAME//\//-}" >> "$GITHUB_ENV"
      - name: Define version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use the vMAJOR.MINOR.PATCH format (for example, v1.2.3)."
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image
        run: docker build . --file Dockerfile --tag $IMAGE_NAME --label "runnumber=${GITHUB_RUN_ID}"
      - name: Push image
        run: |
          IMAGE_ID=ghcr.io/dots-energy/$IMAGE_NAME
          # This changes all uppercase characters to lowercase.
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION